<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#04191a">
  <title>BillBoard: never miss a due date</title>

  <!-- =====================================================
       CSS: how the page LOOKS
       Palette: deep teal background, coral action colour,
       and a traffic-light scale for urgency
       ===================================================== -->
  <style>
    :root {
      --bg1: #04191a; --bg2: #072a2b; --bg3: #0b3a3a;
      --coral: #ff7a59; --coral2: #ff5e6c; --mint: #5eead4; --sand: #ffe9c7;
      --text: #effffd;
      --muted: rgba(239, 255, 253, 0.66);
      --faint: rgba(239, 255, 253, 0.42);
      --line: rgba(153, 246, 228, 0.17);
      --grad: linear-gradient(135deg, #ff9a6b, #ff5e6c);

      /* The urgency colours. Each bill picks ONE of these. */
      --late: #ff6b6b;
      --today: #ff7a59;
      --soon: #ffa94d;
      --week: #ffd666;
      --later: #5eead4;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { background: var(--bg1); scroll-behavior: smooth; }
    body {
      margin: 0; min-height: 100vh;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 15px; letter-spacing: 0.01em; color: var(--text);
      background: linear-gradient(170deg, var(--bg1) 0%, var(--bg2) 55%, var(--bg3) 100%);
      padding-bottom: 130px; -webkit-font-smoothing: antialiased;
    }
    body::before, body::after { content: ""; position: fixed; border-radius: 50%; filter: blur(100px); z-index: -1; pointer-events: none; }
    body::before { width: 340px; height: 340px; background: #ff7a59; opacity: 0.16; top: -110px; right: -90px; }
    body::after  { width: 320px; height: 320px; background: #14b8a6; opacity: 0.22; bottom: 40px; left: -100px; }
    .wrap { max-width: 520px; margin: 0 auto; padding: 0 22px; }
    .hide, [hidden] { display: none !important; }

    /* ---------- Glass ---------- */
    .glass {
      background: linear-gradient(145deg, rgba(153, 246, 228, 0.1), rgba(153, 246, 228, 0.03));
      border: 1px solid var(--line); border-radius: 26px;
      -webkit-backdrop-filter: blur(18px) saturate(140%); backdrop-filter: blur(18px) saturate(140%);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.09), 0 20px 44px rgba(0, 0, 0, 0.4);
    }
    .label { font-size: 11px; font-weight: 500; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); }
    svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; display: block; }

    /* ---------- Header ---------- */
    header { padding: 28px 0 16px; }
    h1 { margin: 0; font-size: 30px; font-weight: 200; letter-spacing: -0.01em; }
    h1 b { font-weight: 600; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .headline { margin: 8px 0 0; font-size: 17px; line-height: 1.4; color: var(--muted); min-height: 24px; }
    .headline strong { color: var(--text); font-weight: 500; }

    /* ---------- Badge, chips ---------- */
    .badge {
      width: 34px; height: 34px; flex: none; border-radius: 50%; display: grid; place-items: center;
      background: rgba(153, 246, 228, 0.12); border: 1px solid rgba(153, 246, 228, 0.28);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.22);
    }
    .chips { display: flex; gap: 10px; flex-wrap: wrap; padding: 2px 2px 8px; }
    .chip {
      display: inline-flex; align-items: center; gap: 9px; height: 46px; padding: 0 18px 0 6px; border-radius: 999px;
      border: 1px solid var(--line);
      background: linear-gradient(145deg, rgba(153, 246, 228, 0.15), rgba(153, 246, 228, 0.04));
      -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
      color: var(--text); font: inherit; font-size: 14px; font-weight: 500; cursor: pointer;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.15), 0 4px 0 rgba(0, 0, 0, 0.5), 0 10px 20px rgba(0, 0, 0, 0.28);
      transition: transform 0.12s, box-shadow 0.12s, background 0.25s;
    }
    .chip.plain { padding: 0 18px; height: 42px; }
    .chip .badge { width: 32px; height: 32px; }
    .chip:active { transform: translateY(3px); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.15), 0 1px 0 rgba(0, 0, 0, 0.5); }
    .chip.on {
      color: #fff; border-color: rgba(255, 255, 255, 0.5); background: var(--grad);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.5), 0 4px 0 #b53a46, 0 0 24px rgba(255, 94, 108, 0.5), 0 10px 20px rgba(0, 0, 0, 0.3);
    }
    .chip.on .badge { background: rgba(255, 255, 255, 0.2); border-color: rgba(255, 255, 255, 0.35); }

    /* ---------- Switch: Upcoming | Paid ---------- */
    .seg { position: relative; display: grid; grid-template-columns: 1fr 1fr; padding: 5px; border-radius: 999px; }
    .seg .ind { position: absolute; top: 5px; bottom: 5px; left: 5px; width: calc(50% - 5px); border-radius: 999px; background: var(--grad); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.45), 0 0 22px rgba(255, 94, 108, 0.45); transition: transform 0.32s cubic-bezier(0.3, 0.9, 0.3, 1); }
    .seg[data-view="paid"] .ind { transform: translateX(100%); }
    .seg button { position: relative; z-index: 1; height: 46px; border: none; background: none; font: inherit; font-size: 14px; font-weight: 500; letter-spacing: 0.04em; color: var(--muted); cursor: pointer; transition: color 0.3s; }
    .seg button.on { color: #fff; }

    /* ---------- Push buttons ---------- */
    .push {
      display: inline-flex; align-items: center; justify-content: center; gap: 10px;
      height: 58px; padding: 0 26px 0 9px; border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.5); background: var(--grad);
      color: #fff; font: inherit; font-size: 15px; font-weight: 600; letter-spacing: 0.03em; cursor: pointer;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.5), 0 5px 0 #b53a46, 0 0 26px rgba(255, 94, 108, 0.45), 0 12px 22px rgba(0, 0, 0, 0.4);
      transition: transform 0.12s, box-shadow 0.12s;
    }
    .push .badge { width: 40px; height: 40px; background: rgba(255, 255, 255, 0.2); border-color: rgba(255, 255, 255, 0.35); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.4); }
    .push:active { transform: translateY(4px); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.5), 0 1px 0 #b53a46, 0 0 18px rgba(255, 94, 108, 0.45); }
    .push.dark {
      color: var(--text); border-color: var(--line);
      background: linear-gradient(145deg, rgba(153, 246, 228, 0.16), rgba(153, 246, 228, 0.04));
      -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.16), 0 5px 0 rgba(0, 0, 0, 0.55), 0 12px 22px rgba(0, 0, 0, 0.3);
    }
    .push.dark .badge { background: rgba(153, 246, 228, 0.12); border-color: rgba(153, 246, 228, 0.28); }
    .push.dark:active { box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.16), 0 1px 0 rgba(0, 0, 0, 0.55); }
    .push.danger { color: #ff9b9b; border-color: rgba(255, 107, 107, 0.4); }
    .push.block { width: 100%; }
    .push.sm { height: 46px; font-size: 14px; padding: 0 20px 0 6px; box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.5), 0 4px 0 #b53a46, 0 0 18px rgba(255, 94, 108, 0.4); }
    .push.sm .badge { width: 34px; height: 34px; }
    .push.sm:active { box-shadow: 0 1px 0 #b53a46; }
    .dock { position: fixed; left: 0; right: 0; bottom: calc(18px + env(safe-area-inset-bottom)); z-index: 15; display: flex; justify-content: center; padding: 0 22px; pointer-events: none; }
    .dock .push { pointer-events: auto; width: min(480px, 100%); height: 62px; }

    /* ---------- Summary ---------- */
    .sum { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 18px; }
    .stat { padding: 16px 16px 14px; border-radius: 22px; }
    .stat .v { font-size: 26px; font-weight: 200; letter-spacing: -0.02em; margin-top: 12px; font-variant-numeric: tabular-nums; }
    .stat .s { color: var(--muted); font-size: 13px; margin-top: 4px; }
    .stat.hot .v { color: var(--late); }
    .stat.warm .v { color: var(--soon); }

    /* ---------- The board: grid of bill tiles ---------- */
    .view { margin-top: 18px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

    /* Each tile gets a level class (lvl-late, lvl-soon ...) which sets --c, its colour */
    .lvl-late  { --c: var(--late); }
    .lvl-today { --c: var(--today); }
    .lvl-soon  { --c: var(--soon); }
    .lvl-week  { --c: var(--week); }
    .lvl-later { --c: var(--later); }

    .bill {
      position: relative; padding: 16px 16px 14px; display: flex; flex-direction: column; min-width: 0; cursor: pointer;
      border-color: color-mix(in srgb, var(--c) 40%, transparent);
      box-shadow: inset 0 3px 0 var(--c), inset 0 1px 0 rgba(255, 255, 255, 0.09), 0 0 28px color-mix(in srgb, var(--c) 16%, transparent), 0 20px 40px rgba(0, 0, 0, 0.35);
      transition: transform 0.15s;
    }
    .bill:active { transform: scale(0.98); }
    .bill.late, .bill.today { animation: nudge 2.6s ease-in-out infinite; }
    .b-top { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .b-top .badge { width: 36px; height: 36px; color: var(--c); border-color: color-mix(in srgb, var(--c) 45%, transparent); background: color-mix(in srgb, var(--c) 14%, transparent); }
    .b-name { font-weight: 500; font-size: 15px; line-height: 1.25; min-width: 0; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; word-break: break-word; }
    .b-num { font-size: 46px; font-weight: 200; letter-spacing: -0.03em; line-height: 1; margin-top: 18px; color: var(--c); font-variant-numeric: tabular-nums; }
    .b-num.word { font-size: 32px; padding: 7px 0 6px; }
    .b-unit { margin-top: 6px; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--c); opacity: 0.9; font-weight: 500; }
    .b-amt { margin-top: 14px; font-size: 16px; font-weight: 500; font-variant-numeric: tabular-nums; }
    .b-amt.none { color: var(--faint); font-weight: 400; font-size: 14px; }
    .b-meta { color: var(--muted); font-size: 12px; margin: 4px 0 14px; display: flex; align-items: center; gap: 6px; }
    .b-meta svg.i { width: 13px; height: 13px; }
    .bill .push { width: 100%; margin-top: auto; }

    .empty { text-align: center; color: var(--muted); padding: 40px 20px; line-height: 1.7; }
    .empty .big { font-size: 42px; display: block; margin-bottom: 8px; }
    .empty b { color: var(--text); font-weight: 500; }

    /* ---------- Paid list ---------- */
    .list { padding: 6px 20px; }
    .hrow { display: flex; align-items: center; gap: 14px; padding: 15px 0; border-bottom: 1px solid var(--line); }
    .hrow:last-child { border-bottom: none; }
    .hrow .info { flex: 1; min-width: 0; }
    .hrow .t { font-weight: 500; }
    .hrow .d { color: var(--muted); font-size: 13px; margin-top: 3px; }
    .hrow .amt { font-weight: 500; font-variant-numeric: tabular-nums; }
    .hrow .badge { color: var(--mint); }

    /* ---------- Dialog (add / edit) ---------- */
    dialog { border: none; padding: 0; background: transparent; color: var(--text); width: 100%; max-width: 560px; margin: auto auto 0; max-height: 94vh; overflow: visible; }
    dialog::backdrop { background: rgba(2, 14, 15, 0.75); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); }
    dialog[open] { animation: slideUp 0.35s cubic-bezier(0.2, 0.9, 0.3, 1); }
    .sheet {
      max-height: 92vh; overflow-y: auto; padding: 12px 22px calc(26px + env(safe-area-inset-bottom)); border-radius: 30px 30px 0 0;
      background: linear-gradient(160deg, rgba(11, 58, 58, 0.95), rgba(4, 25, 26, 0.98));
      -webkit-backdrop-filter: blur(26px); backdrop-filter: blur(26px);
      border: 1px solid var(--line); border-bottom: none;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.1), 0 -20px 50px rgba(0, 0, 0, 0.55);
    }
    .grab { width: 44px; height: 5px; background: var(--line); border-radius: 9px; margin: 0 auto 16px; }
    .sheet h2 { margin: 0 0 4px; font-size: 22px; font-weight: 300; }
    .step { font-size: 14px; font-weight: 500; color: var(--mint); margin: 20px 0 10px; }
    .field {
      width: 100%; height: 54px; padding: 0 16px; border-radius: 16px; border: 1px solid var(--line);
      background: rgba(153, 246, 228, 0.07); color: var(--text); font: inherit; font-size: 17px; color-scheme: dark;
    }
    .field::placeholder { color: var(--faint); }
    .field:focus { outline: none; border-color: var(--mint); box-shadow: 0 0 0 3px rgba(94, 234, 212, 0.22); }
    .field.bad { border-color: var(--late); animation: shake 0.35s; }
    .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .money { position: relative; }
    .money span { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--mint); font-size: 18px; }
    .money .field { padding-left: 38px; }
    .hint { margin-top: 10px; min-height: 20px; color: var(--sand); font-size: 14px; }
    .submit { width: 100%; margin-top: 16px; height: 58px; }

    /* ---------- Toast ---------- */
    .toast {
      position: fixed; left: 50%; top: 18px; z-index: 1000; transform: translate(-50%, -100px);
      display: flex; align-items: center; gap: 14px; padding: 13px 20px; border-radius: 999px;
      background: rgba(239, 255, 253, 0.97); color: #04302f; font-size: 14px; font-weight: 500;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.5); transition: transform 0.3s cubic-bezier(0.2, 1.3, 0.4, 1); max-width: 92vw;
    }
    .toast.show { transform: translate(-50%, 0); }
    .toast button { border: none; background: none; color: #d6455a; font: inherit; font-weight: 700; cursor: pointer; }

    @keyframes slideUp { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
    @keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
    @keyframes nudge { 0%, 100% { transform: none; } 50% { transform: translateY(-3px); } }
    ::view-transition-group(*) { animation-duration: 0.45s; animation-timing-function: cubic-bezier(0.2, 0.9, 0.3, 1); }
    ::view-transition-old(root), ::view-transition-new(root) { animation-duration: 0.2s; }
    @media (max-width: 360px) { .grid { grid-template-columns: 1fr; } }
    @media (prefers-reduced-motion: reduce) { * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; } }
  </style>
</head>

<body>
  <!-- =====================================================
       HTML: the STRUCTURE of the page
       ===================================================== -->
  <div class="wrap">
    <header>
      <h1>Bill<b>Board</b></h1>
      <p class="headline" id="headline"></p>
    </header>

    <div class="glass seg" id="seg" data-view="upcoming">
      <div class="ind"></div>
      <button class="on" type="button" data-act="view" data-view="upcoming">Upcoming</button>
      <button type="button" data-act="view" data-view="paid">Paid</button>
    </div>

    <!-- Upcoming -->
    <section class="view" id="v-upcoming">
      <div class="sum" id="sum"></div>
      <div class="grid" id="board" style="margin-top:18px"></div>
    </section>

    <!-- Paid -->
    <section class="view" id="v-paid" hidden>
      <div class="sum" id="paidSum"></div>
      <div class="glass list" id="paidList" style="margin-top:18px"></div>
    </section>
  </div>

  <div class="dock"><button class="push" id="addBtn" type="button" data-act="add"><span class="badge" id="addIcon"></span>Add a bill</button></div>

  <!-- Add / edit dialog -->
  <dialog id="dlg">
    <form class="sheet" id="form" autocomplete="off">
      <div class="grab"></div>
      <h2 id="dlgTitle">Add a bill</h2>

      <div class="step">1 · What kind of bill?</div>
      <div class="chips" id="catChips"></div>
      <input class="field" id="fName" maxlength="40" placeholder="Name (for example: Rent)">

      <div class="step">2 · How much? <span style="color:var(--faint)">(optional)</span></div>
      <div class="money"><span>₦</span><input class="field" id="fAmount" type="number" inputmode="decimal" min="0" step="any" placeholder="0"></div>

      <div class="step">3 · When is it due?</div>
      <div class="chips" id="dueChips"></div>
      <input class="field" id="fDue" type="date">
      <div class="hint" id="dueHint"></div>

      <div class="step">4 · Does it repeat?</div>
      <div class="chips" id="repChips"></div>

      <button class="push submit" type="submit"><span class="badge" id="saveIcon"></span>Save bill</button>
      <button class="push dark danger block hide" id="delBtn" type="button" data-act="delete" style="margin-top:14px"><span class="badge" id="delIcon"></span>Delete this bill</button>
    </form>
  </dialog>

  <div class="toast" id="toast"></div>

  <!-- =====================================================
       JavaScript: the BRAIN of the app
       Today's big lessons:
         1. DATE COMPARISON  (how many days until a bill is due?)
         2. CONDITIONAL STYLING (a bill's colour depends on that number)
       The star of the show is the function urgencyOf(). Find it!
       ===================================================== -->
  <script>
    "use strict";

    // ---------- 1. Helpers ----------
    const $ = (id) => document.getElementById(id);
    const sum = (list, pick = (x) => x) => list.reduce((t, x) => t + pick(x), 0);
    const uid = () => "b" + (crypto.randomUUID?.() ?? Date.now().toString(36) + Math.random().toString(36).slice(2, 7));
    const clone = (o) => (typeof structuredClone === "function" ? structuredClone(o) : JSON.parse(JSON.stringify(o)));
    Array.prototype.toSorted ??= function (fn) { return [...this].sort(fn); };
    const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const nf = new Intl.NumberFormat("en-NG", { maximumFractionDigits: 0 });
    const naira = (n) => "₦" + nf.format(Math.round(n));
    const plural = (n, word) => `${n} ${word}${n === 1 ? "" : "s"}`;

    // ---------- 2. Dates (the heart of this app) ----------
    const toISO = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
    const parse = (iso) => { const [y, m, d] = iso.split("-").map(Number); return new Date(y, m - 1, d); };
    const isISO = (s) => typeof s === "string" && /^\d{4}-\d{2}-\d{2}$/.test(s) && !Number.isNaN(parse(s).getTime());
    const today = () => toISO(new Date());
    const addDays = (iso, n) => { const d = parse(iso); d.setDate(d.getDate() + n); return toISO(d); };

    // How many days from today until a date? 0 = today, 3 = in three days, -2 = two days ago.
    const daysLeft = (iso) => Math.round((parse(iso) - parse(today())) / 86400000);

    // Add months, but keep the same day of the month. Example: a bill due on the 31st
    // goes to 28 Feb, then back to 31 Mar (not stuck on the 28th).
    function addMonthsAnchored(iso, months, anchorDay) {
      const d = parse(iso);
      d.setDate(1);
      d.setMonth(d.getMonth() + months);
      const lastDay = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
      d.setDate(Math.min(anchorDay, lastDay));
      return toISO(d);
    }
    const endOfMonth = () => { const n = new Date(); return toISO(new Date(n.getFullYear(), n.getMonth() + 1, 0)); };
    const dFmt = new Intl.DateTimeFormat("en-GB", { weekday: "short", day: "numeric", month: "short" });
    const dShort = new Intl.DateTimeFormat("en-GB", { day: "numeric", month: "short" });
    const fmtDay = (iso) => dFmt.format(parse(iso));
    const fmtShort = (iso) => dShort.format(parse(iso));

    // ---------- 3. Icons ----------
    const ICONS = {
      home: '<path d="M4 11l8-7 8 7M6 10v10h12V10M10 20v-5h4v5"/>',
      tv: '<rect x="3" y="5" width="18" height="12" rx="2.5"/><path d="M8 21h8M12 17v4"/>',
      school: '<path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11.5V16c0 1.5 3 3 6 3s6-1.5 6-3v-4.5M22 9v6"/>',
      power: '<path d="M13 3L5 13h6l-1 8 8-10h-6z"/>',
      net: '<path d="M3 9a14 14 0 0 1 18 0M6 12.5a9.5 9.5 0 0 1 12 0M9.2 16a5 5 0 0 1 5.6 0M12 19.5h.01"/>',
      other: '<path d="M4 12V5h7l9 9-7 7z"/><path d="M8 8h.01"/>',
      plus: '<path d="M12 5v14M5 12h14"/>', check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
      trash: '<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
      repeat: '<path d="M4 11V9a3 3 0 0 1 3-3h11l-3-3M20 13v2a3 3 0 0 1-3 3H6l3 3"/>',
      calendar: '<rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M8 3v4M16 3v4"/>',
      sparkle: '<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/>',
      alert: '<path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18h.01"/>',
      clock: '<circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3 2"/>',
      wallet: '<path d="M4 7h14a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a1 1 0 0 1-1-1z"/><path d="M4 7l11-3v3M16 14h.01"/>'
    };
    const icon = (name) => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${ICONS[name] ?? ICONS.other}</svg>`;

    const CATS = {
      rent: { name: "Rent", icon: "home" }, tv: { name: "DStv / TV", icon: "tv" }, school: { name: "School fees", icon: "school" },
      power: { name: "Electricity", icon: "power" }, net: { name: "Internet", icon: "net" }, other: { name: "Other", icon: "other" }
    };
    const REPEATS = { none: "Once", weekly: "Weekly", monthly: "Monthly", yearly: "Yearly" };

    // ---------- 4. Data, saving, undo ----------
    // bill: { id, name, cat, amount, due: "2026-12-01", repeat, anchor }
    // paid: { id, name, cat, amount, due, paidOn, ts }
    const KEY = "billboard_v1";
    let store = { bills: [], paid: [] };
    const ui = { view: "upcoming", cat: "rent", repeat: "none", editId: null };
    let undoSnap = null;

    function load() {
      try {
        const raw = JSON.parse(localStorage.getItem(KEY) ?? "{}");
        store = { bills: Array.isArray(raw.bills) ? raw.bills.filter((b) => isISO(b?.due)) : [], paid: Array.isArray(raw.paid) ? raw.paid : [] };
      } catch { store = { bills: [], paid: [] }; }
    }
    function save() { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch { toast("Could not save on this device"); } }

    // Every change goes through commit(): it keeps a photo of the data first, so Undo works
    function commit(message, change) {
      undoSnap = clone(store);
      change();
      save();
      withTransition(render);
      toast(message, "Undo", undo);
    }
    function undo() {
      if (!undoSnap) return;
      store = undoSnap; undoSnap = null;
      save(); withTransition(render);
      toast("Undone");
    }

    // ---------- 5. Smooth animations ----------
    function withTransition(change) {                         // MODERN JS: View Transitions API
      if (!document.startViewTransition || matchMedia("(prefers-reduced-motion: reduce)").matches) return change();
      document.startViewTransition(change);
    }
    function staggerIn(selector) {                            // MODERN JS: Web Animations API
      document.querySelectorAll(selector).forEach((el, i) => {
        el.animate([{ opacity: 0, transform: "translateY(18px) scale(0.97)" }, { opacity: 1, transform: "none" }],
          { duration: 500, delay: Math.min(i, 10) * 55, easing: "cubic-bezier(.2,.9,.3,1)", fill: "backwards" });
      });
    }
    let toastTimer;
    function toast(message, actionLabel, action) {
      const t = $("toast");
      t.replaceChildren(Object.assign(document.createElement("span"), { textContent: message }));
      if (actionLabel) {
        const b = Object.assign(document.createElement("button"), { textContent: actionLabel });
        b.onclick = () => { action(); };
        t.append(b);
      }
      t.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove("show"), 4500);
    }

    // =====================================================
    // 6. THE STAR FUNCTION: urgencyOf()
    // It takes "days left" and returns the colour level and the words.
    // Change the numbers here and the whole board changes with them.
    // =====================================================
    function urgencyOf(days) {
      if (days < 0)  return { level: "late",  number: String(-days), unit: days === -1 ? "day late" : "days late", word: false };
      if (days === 0) return { level: "today", number: "Today",       unit: "due now",                            word: true };
      if (days <= 3) return { level: "soon",  number: String(days),  unit: days === 1 ? "day left" : "days left", word: false };
      if (days <= 7) return { level: "week",  number: String(days),  unit: "days left",                          word: false };
      return           { level: "later", number: String(days),       unit: "days left",                          word: false };
    }

    // What is the next due date after paying a repeating bill?
    function nextDue(bill) {
      if (bill.repeat === "weekly") return addDays(bill.due, 7);
      if (bill.repeat === "monthly") return addMonthsAnchored(bill.due, 1, bill.anchor);
      if (bill.repeat === "yearly") return addMonthsAnchored(bill.due, 12, bill.anchor);
      return null;
    }

    // Bills sorted with the most urgent first (the smallest number of days)
    const sortedBills = () => store.bills.toSorted((a, b) => a.due.localeCompare(b.due) || a.name.localeCompare(b.name));

    // ---------- 7. Drawing the screen ----------
    function render() {
      renderHeadline();
      $("seg").dataset.view = ui.view;
      document.querySelectorAll("#seg button").forEach((b) => b.classList.toggle("on", b.dataset.view === ui.view));
      $("v-upcoming").hidden = ui.view !== "upcoming";
      $("v-paid").hidden = ui.view !== "paid";
      $("addBtn").parentElement.hidden = false;
      renderBoard();
      renderPaid();
    }

    // A friendly sentence at the top that changes with your situation
    function renderHeadline() {
      const bills = store.bills, list = bills.map((b) => daysLeft(b.due));
      const late = list.filter((d) => d < 0).length, now = list.filter((d) => d === 0).length, week = list.filter((d) => d > 0 && d <= 7).length;
      let html;
      if (!bills.length) html = "Add your bills and never miss a due date.";
      else if (late) html = `<strong>${plural(late, "bill")} overdue.</strong> Let us clear ${late === 1 ? "it" : "them"} first.`;
      else if (now) html = `<strong>${plural(now, "bill")} due today.</strong>${week ? ` ${plural(week, "more")} this week.` : ""}`;
      else if (week) html = `<strong>${plural(week, "bill")} due this week.</strong> You are on top of it.`;
      else html = "<strong>All clear.</strong> Nothing due in the next 7 days.";
      $("headline").innerHTML = html;
    }

    function renderBoard() {
      const bills = sortedBills();
      const lateBills = bills.filter((b) => daysLeft(b.due) < 0);
      const weekBills = bills.filter((b) => { const d = daysLeft(b.due); return d >= 0 && d <= 7; });
      const stat = (cls, label, ic, bills_, note) => `<div class="glass stat ${cls}"><span class="label">${label}</span>
        <div class="v">${bills_.length ? naira(sum(bills_, (b) => b.amount)) : "₦0"}</div><div class="s">${bills_.length ? plural(bills_.length, "bill") : note}</div></div>`;
      $("sum").innerHTML = bills.length
        ? stat(lateBills.length ? "hot" : "", "Overdue", "alert", lateBills, "Nothing late") + stat(weekBills.length ? "warm" : "", "Next 7 days", "clock", weekBills, "Nothing due")
        : "";

      if (!bills.length) {
        $("board").style.gridColumn = "1 / -1";
        $("board").innerHTML = `<div class="glass empty" style="grid-column:1/-1"><span class="big">🧾</span><b>No bills yet.</b><br>Add rent, DStv, school fees or anything you must pay on time. Each one gets a countdown.<br><br>
          <button class="push dark" type="button" data-act="sample"><span class="badge">${icon("sparkle")}</span>Try sample bills</button></div>`;
        return;
      }
      $("board").style.gridColumn = "";
      $("board").innerHTML = bills.map((b) => {
        const days = daysLeft(b.due), u = urgencyOf(days), cat = CATS[b.cat] ?? CATS.other;
        return `<article class="glass bill lvl-${u.level} ${u.level}" data-act="edit" data-id="${b.id}" style="view-transition-name: bill-${b.id}">
          <div class="b-top"><span class="badge">${icon(cat.icon)}</span><span class="b-name">${esc(b.name)}</span></div>
          <div class="b-num ${u.word ? "word" : ""}">${u.number}</div>
          <div class="b-unit">${u.unit}</div>
          <div class="b-amt ${b.amount ? "" : "none"}">${b.amount ? naira(b.amount) : "No amount set"}</div>
          <div class="b-meta">${icon(b.repeat !== "none" ? "repeat" : "calendar")}${fmtDay(b.due)}${b.repeat !== "none" ? " · " + REPEATS[b.repeat].toLowerCase() : ""}</div>
          <button class="push sm" type="button" data-act="paid" data-id="${b.id}"><span class="badge">${icon("check")}</span>Paid</button>
        </article>`;
      }).join("");
    }

    function renderPaid() {
      const ym = today().slice(0, 7), month = store.paid.filter((p) => p.paidOn.startsWith(ym));
      $("paidSum").innerHTML = `<div class="glass stat"><span class="label">Paid this month</span><div class="v">${naira(sum(month, (p) => p.amount))}</div><div class="s">${plural(month.length, "bill")}</div></div>
        <div class="glass stat"><span class="label">All time</span><div class="v">${naira(sum(store.paid, (p) => p.amount))}</div><div class="s">${plural(store.paid.length, "bill")}</div></div>`;
      const rows = store.paid.toSorted((a, b) => b.paidOn.localeCompare(a.paidOn) || b.ts - a.ts).slice(0, 40);
      $("paidList").innerHTML = rows.length ? rows.map((p) => {
        const early = Math.round((parse(p.due) - parse(p.paidOn)) / 86400000);
        const when = early > 0 ? `${plural(early, "day")} early` : early === 0 ? "on the day" : `${plural(-early, "day")} late`;
        return `<div class="hrow"><span class="badge">${icon((CATS[p.cat] ?? CATS.other).icon)}</span>
          <div class="info"><div class="t">${esc(p.name)}</div><div class="d">Paid ${fmtShort(p.paidOn)} · ${when}</div></div>
          <div class="amt">${p.amount ? naira(p.amount) : "-"}</div></div>`;
      }).join("") : `<div class="empty"><span class="big">✅</span>Nothing paid yet.<br>Tap <b>Paid</b> on a bill when you have settled it.</div>`;
    }

    // ---------- 8. Marking a bill as paid ----------
    function markPaid(id) {
      const bill = store.bills.find((b) => b.id === id);
      if (!bill) return;
      const next = nextDue(bill);
      commit(next ? `${bill.name} paid. Next due ${fmtDay(next)}` : `${bill.name} paid`, () => {
        store.paid.push({ id: uid(), name: bill.name, cat: bill.cat, amount: bill.amount, due: bill.due, paidOn: today(), ts: Date.now() });
        if (next) bill.due = next;                                   // repeating bill: move to the next date
        else store.bills = store.bills.filter((b) => b.id !== id);   // one-off bill: remove from the board
      });
      if (navigator.vibrate) navigator.vibrate(30);
    }

    // ---------- 9. The add / edit form ----------
    const dlg = $("dlg");
    const QUICK_DUE = [["Today", () => today()], ["Tomorrow", () => addDays(today(), 1)], ["In a week", () => addDays(today(), 7)], ["Month end", endOfMonth]];

    function drawChips() {
      $("catChips").innerHTML = Object.entries(CATS).map(([k, c]) =>
        `<button class="chip ${ui.cat === k ? "on" : ""}" type="button" data-act="cat" data-k="${k}"><span class="badge">${icon(c.icon)}</span>${c.name}</button>`).join("");
      $("repChips").innerHTML = Object.entries(REPEATS).map(([k, label]) =>
        `<button class="chip plain ${ui.repeat === k ? "on" : ""}" type="button" data-act="repeat" data-k="${k}">${label}</button>`).join("");
      const current = $("fDue").value;
      $("dueChips").innerHTML = QUICK_DUE.map(([label, fn], i) =>
        `<button class="chip plain ${fn() === current ? "on" : ""}" type="button" data-act="due" data-i="${i}">${label}</button>`).join("");
      showDueHint();
    }
    function showDueHint() {
      const v = $("fDue").value;
      if (!isISO(v)) { $("dueHint").textContent = ""; return; }
      const d = daysLeft(v);
      $("dueHint").textContent = `${fmtDay(v)} · ${d === 0 ? "today" : d > 0 ? "in " + plural(d, "day") : plural(-d, "day") + " ago"}`;
    }
    function openForm(id) {
      const b = id ? store.bills.find((x) => x.id === id) : null;
      ui.editId = id ?? null;
      ui.cat = b?.cat ?? "rent";
      ui.repeat = b?.repeat ?? "none";
      $("dlgTitle").textContent = b ? "Edit bill" : "Add a bill";
      $("fName").value = b?.name ?? CATS[ui.cat].name;
      $("fAmount").value = b?.amount || "";
      $("fDue").value = b?.due ?? addDays(today(), 7);
      $("delBtn").classList.toggle("hide", !b);
      $("fName").classList.remove("bad"); $("fDue").classList.remove("bad");
      drawChips();
      dlg.showModal();
    }

    $("form").addEventListener("submit", (e) => {
      e.preventDefault();
      const name = $("fName").value.trim(), due = $("fDue").value, amount = Math.max(0, Number($("fAmount").value) || 0);
      const bad = [];
      if (!name) bad.push("fName");
      if (!isISO(due)) bad.push("fDue");
      if (bad.length) { bad.forEach((id) => $(id).classList.add("bad")); setTimeout(() => bad.forEach((id) => $(id).classList.remove("bad")), 600); return; }
      const anchor = parse(due).getDate();
      dlg.close();
      if (ui.editId) {
        commit("Bill updated", () => {
          const b = store.bills.find((x) => x.id === ui.editId);
          Object.assign(b, { name: name.slice(0, 40), cat: ui.cat, amount, due, repeat: ui.repeat, anchor });
        });
      } else {
        commit(`${name} added`, () => store.bills.push({ id: uid(), name: name.slice(0, 40), cat: ui.cat, amount, due, repeat: ui.repeat, anchor }));
      }
    });
    $("fDue").addEventListener("input", drawChips);

    // ---------- 10. Buttons: one listener for everything ----------
    const ACTIONS = {
      add: () => openForm(null),
      edit: (el) => openForm(el.dataset.id),
      paid: (el) => markPaid(el.dataset.id),
      view: (el) => { ui.view = el.dataset.view; withTransition(render); staggerIn(ui.view === "upcoming" ? "#board > *" : "#paidList, #paidSum > *"); },
      cat: (el) => {
        const wasDefault = Object.values(CATS).some((c) => c.name === $("fName").value.trim()) || !$("fName").value.trim();
        ui.cat = el.dataset.k;
        if (wasDefault) $("fName").value = CATS[ui.cat].name;      // swap the name only if you have not typed your own
        drawChips();
      },
      repeat: (el) => { ui.repeat = el.dataset.k; drawChips(); },
      due: (el) => { $("fDue").value = QUICK_DUE[Number(el.dataset.i)][1](); drawChips(); },
      delete: () => {
        const b = store.bills.find((x) => x.id === ui.editId);
        if (!b) return;
        dlg.close();
        commit(`${b.name} deleted`, () => { store.bills = store.bills.filter((x) => x.id !== b.id); });
      },
      sample: () => {
        const t = today(), mk = (name, cat, amount, days, repeat) => ({ id: uid(), name, cat, amount, due: addDays(t, days), repeat, anchor: parse(addDays(t, days)).getDate() });
        commit("Sample bills added", () => store.bills.push(
          mk("Internet subscription", "net", 20000, -2, "monthly"), mk("Electricity token", "power", 5000, 0, "weekly"),
          mk("DStv", "tv", 12500, 2, "monthly"), mk("School fees", "school", 185000, 5, "none"),
          mk("House rent", "rent", 450000, 24, "yearly"), mk("Church levy", "other", 10000, 12, "monthly")
        ));
      }
    };
    document.addEventListener("click", (e) => {
      const el = e.target.closest("[data-act]");
      if (el) { ACTIONS[el.dataset.act]?.(el, e); return; }
      if (e.target instanceof HTMLDialogElement) e.target.close();      // tap the dark area to close
    });

    // Refresh the countdowns when you come back to the app (a new day may have started)
    document.addEventListener("visibilitychange", () => { if (!document.hidden) render(); });

    // ---------- 11. Start ----------
    $("addIcon").innerHTML = icon("plus");
    $("saveIcon").innerHTML = icon("check");
    $("delIcon").innerHTML = icon("trash");
    load();
    render();
    staggerIn("#sum > *, #board > *");
  </script>
</body>
</html>
